<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu ⇄ English Translator</title>
<style>
body{margin:0;font-family:Arial;background:#f2f4f8;padding:15px}
.top{text-align:center}
.top h1{font-size:22px;margin:10px 0 0}
.top p{color:#666;font-size:13px}
.card{background:#fff;border-radius:15px;padding:15px;margin-top:15px;box-shadow:0 2px 10px #0001}
textarea{width:100%;height:120px;border:0;outline:none;font-size:20px;resize:none;box-sizing:border-box}
.result-label{font-weight:bold;margin-top:10px}
.result-box{min-height:80px;background:#f8f9ff;border-radius:10px;padding:12px;font-size:20px;margin-top:5px;box-sizing:border-box}
.lang-row{display:flex;justify-content:center;gap:10px;margin-top:15px;align-items:center}
.lang-pill{border:0;background:#eef1ff;padding:10px 25px;border-radius:20px;font-weight:bold;cursor:pointer}
.lang-pill.active{background:#6c5ce7;color:#fff}
.swap{border:0;background:#eee;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.btn-row{display:flex;gap:10px;margin-top:15px}
.btn-row button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;background:#eef1ff}
</style>
</head>
<body>
<div class="top">
<h1>Google Translate - SCREAMHIVE</h1>
<p>Urdu ⇄ English - 100% Free</p>
</div>
<button id="installBtn" style="display:block;background:#000;color:#fff;padding:10px 20px;border-radius:20px;border:0;font-weight:bold;margin:10px auto;">📲 Install App</button>
<div class="card">
<p>Translate text</p>
<textarea id="inputText" placeholder="Type here..." oninput="autoTranslate()"></textarea>
<button onclick="pasteText()">Paste</button>

<p class="result-label">Translation</p>
<div class="result-box" id="outputText"></div>

<div class="lang-row">
<button class="lang-pill active" id="btnUrdu" onclick="setLang('ur-en')">Urdu</button>
<button class="swap" onclick="swapLang()">⇄</button>
<button class="lang-pill" id="btnEng" onclick="setLang('en-ur')">English</button>
</div>

<div class="btn-row">
<button onclick="copyText()">Copy</button>
<button onclick="clearText()">Clear</button>
</div>
</div>

<script>
let pair = "ur-en";
function setLang(m){
pair = m;
document.getElementById('btnUrdu').classList.toggle('active', m==='ur-en');
document.getElementById('btnEng').classList.toggle('active', m==='en-ur');
autoTranslate();
}
function swapLang(){
pair = pair==='ur-en' ? 'en-ur' : 'ur-en';
let a = document.getElementById('inputText').value;
let b = document.getElementById('outputText').innerText;
document.getElementById('inputText').value = b;
document.getElementById('outputText').innerText = a;
setLang(pair);
}
let timer;
function autoTranslate(){
clearTimeout(timer);
timer = setTimeout(translateText, 500);
}
async function translateText(){
let text = document.getElementById('inputText').value.trim();
if(!text){document.getElementById('outputText').innerText="";return;}
let s = pair.split('-');
let langpair = s[0]+'|'+s[1];
try{
let res = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+langpair);
let data = await res.json();
document.getElementById('outputText').innerText = data.responseData.translatedText;
}catch(e){
document.getElementById('outputText').innerText="Error";
}
}
function copyText(){
let t = document.getElementById('outputText').innerText;
navigator.clipboard.writeText(t);
alert('Copied');
}
function clearText(){
document.getElementById('inputText').value="";
document.getElementById('outputText').innerText="";
}
async function pasteText(){
try{
let t = await navigator.clipboard.readText();
document.getElementById('inputText').value = t;
autoTranslate();
}catch(e){alert('Paste not allowed');}
}
</script>
  <script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
  } else {
    alert('Upar 3 dots pe click karo > Add to Home Screen dabao');
  }
});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu <> English Translator - SCREAMHIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:20px}
.container{max-width:700px;margin:auto;text-align:center}
h1{color:#ff2b2b;font-size:26px;margin-bottom:5px}
p{color:#aaa;margin-bottom:15px}
.switch{display:flex;gap:10px;justify-content:center;margin-bottom:15px}
.switch button{padding:12px 18px;border-radius:50px;border:1px solid #444;background:#222;color:#fff;cursor:pointer;font-weight:bold;font-size:14px;width:auto}
.switch button.active{background:#ff2b2b;border-color:#ff2b2b}
textarea{width:100%;min-height:120px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px;padding:15px;font-size:18px;outline:none}
#input{direction:rtl;text-align:right}
#output{background:#111}
.btn{background:#ff2b2b;color:#fff;border:none;padding:14px 25px;border-radius:50px;font-size:17px;font-weight:bold;cursor:pointer;margin:15px 5px;width:90%;max-width:320px}
.btn2{background:#222;border:1px solid #444;color:#fff;padding:12px 20px;border-radius:50px;cursor:pointer;margin:5px}
.small{color:#888;font-size:13px;margin-top:10px}
a{color:#ff2b2b;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Urdu ⇄ English Translator</h1>
<p>Ab dono taraf tarjuma karo - Bilkul Free</p>

<div class="switch">
<button id="btnUrEn" class="active" onclick="setMode('ur-en')">Urdu ➜ English</button>
<button id="btnEnUr" onclick="setMode('en-ur')">English ➜ Urdu</button>
</div>

<textarea id="input" placeholder="یہاں اردو لکھیں... مثال: میرا نام دانش ہے"></textarea>
<br>
<button class="btn" onclick="translateNow()">Translate Karo ➜</button><br>
<button class="btn2" onclick="swapMode()">⇄ Ulta Karo</button>
<button class="btn2" onclick="copyText()">Copy Karo</button>

<textarea id="output" placeholder="Yahan English aayega... Example: My name is Danish" readonly></textarea>
<p class="small" id="status">Words: 0 | SCREAMHIVE</p>
<p><a href="index.html">← Wapas Home pe jao</a></p>
</div>

<script>
let mode = 'ur-en';
function setMode(m){
  mode = m;
  document.getElementById("btnUrEn").classList.toggle("active", m==='ur-en');
  document.getElementById("btnEnUr").classList.toggle("active", m==='en-ur');
  let inp = document.getElementById("input");
  let out = document.getElementById("output");
  if(m==='ur-en'){
    inp.style.direction='rtl'; inp.style.textAlign='right';
    inp.placeholder='یہاں اردو لکھیں... مثال: میرا نام دانش ہے';
    out.placeholder='Yahan English aayega... Example: My name is Danish';
    out.style.direction='ltr'; out.style.textAlign='left';
  }else{
    inp.style.direction='ltr'; inp.style.textAlign='left';
    inp.placeholder='Write English here... Example: My name is Danish';
    out.placeholder='Yahan Urdu aayega... Misal: میرا نام دانش ہے';
    out.style.direction='rtl'; out.style.textAlign='right';
  }
  inp.value=''; out.value='';
  document.getElementById("status").innerText='Words: 0 | SCREAMHIVE';
}
function swapMode(){
  setMode(mode==='ur-en' ? 'en-ur' : 'ur-en');
}
async function translateNow(){
  let text = document.getElementById("input").value.trim();
  let out = document.getElementById("output");
  if(!text){ out.value = mode==='ur-en' ? "Pehle upar Urdu likho!" : "Pehle upar English likho!"; return; }
  out.value = "Translating... thora wait karo...";
  let pair = mode==='ur-en' ? "ur|en" : "en|ur";
  try{
    let res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + pair);
    let data = await res.json();
    out.value = data.responseData.translatedText;
    document.getElementById("status").innerText = "Words: " + text.split(/\s+/).length + " | Done ✅";
  }catch(e){
    out.value = "Internet slow hai, dobara try karo.";
  }
}
function copyText(){
  let o = document.getElementById("output");
  o.select(); document.execCommand("copy");
  alert("Copy ho gaya ✅");
}
document.getElementById("input").addEventListener("input", function(){
  let t = this.value.trim();
  document.getElementById("status").innerText = "Words: " + (t ? t.split(/\s+/).length : 0);
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu ⇄ English Translator - SCREAMHIVE | 100% Free</title>
<meta name="description" content="Free Urdu to English Translator and English to Urdu Translator Online. Translate Both Ways - 100% Free.">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:#fff;padding:15px}
h1{color:#ff2a2a;text-align:center;font-size:26px}
p.sub{text-align:center;color:#aaa;margin:5px 0 15px}
.install{display:block;width:200px;margin:0 auto 20px;background:#00c853;color:#fff;text-align:center;padding:10px;border-radius:25px;font-weight:bold;text-decoration:none}
.lang-box{background:#fff;border-radius:30px;display:flex;align-items:center;justify-content:space-between;padding:6px;margin-bottom:15px}
.lang-btn{flex:1;background:#f1f1f1;border:0;padding:12px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;color:#333}
.lang-btn.active{background:#111;color:#fff}
.swap-btn{background:#ff2a2a;color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:20px;margin:0 8px;cursor:pointer}
textarea{width:100%;height:160px;background:#1e1e1e;color:#fff;border:2px solid #333;border-radius:15px;padding:15px;font-size:20px;outline:none;resize:none}
textarea::placeholder{color:#888;font-size:22px}
.output{width:100%;min-height:140px;background:#1e1e1e;border:2px solid #00c853;border-radius:15px;padding:15px;font-size:20px;margin-top:15px;white-space:pre-wrap}
.translate-btn{width:100%;background:#ff2a2a;color:#fff;border:0;padding:15px;border-radius:30px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:12px;justify-content:center}
.small{background:#222;color:#fff;border:1px solid #444;padding:10px 18px;border-radius:20px;cursor:pointer}
.footer{text-align:center;color:#777;margin-top:20px;font-size:13px}
.footer a{color:#ff2a2a;text-decoration:none;margin:0 5px}
</style>
</head>
<body>

<h1>Urdu ⇄ English Translator</h1>
<p class="sub">Translate Both Ways - 100% Free</p>
<a class="install" href="#">📱 Install App - Free</a>

<div class="lang-box">
  <button class="lang-btn active" id="btnUrdu" onclick="setLang('ur-en')">Urdu</button>
  <button class="swap-btn" onclick="swapLang()">⇄</button>
  <button class="lang-btn" id="btnEng" onclick="setLang('en-ur')">English</button>
</div>

<textarea id="inputText" placeholder="Translate text"></textarea>
<button class="translate-btn" onclick="translateNow()">Translate Now ➔</button>
<div class="output" id="outputText">Translation yahan aayega...</div>

<div class="row">
  <button class="small" onclick="swapLang()">⇄ Swap</button>
  <button class="small" onclick="copyText()">Copy Text</button>
  <button class="small" onclick="pasteText()">Paste</button>
</div>

<p class="footer">Words: <span id="count">0</span> | SCREAMHIVE | 50,000 Limit<br><br>
<a href="index.html">← Back to Home</a> | <a href="privacy.html">Privacy Policy</a> | <a href="about.html">About</a> | <a href="contact.html">Contact</a></p>

<script>
let mode='ur-en';
function setLang(m){mode=m;document.getElementById('btnUrdu').classList.toggle('active',m==='ur-en');document.getElementById('btnEng').classList.toggle('active',m==='en-ur');document.getElementById('inputText').placeholder=m==='ur-en'?'Translate text - Urdu likhein':'Translate text - English likhein';}
function swapLang(){setLang(mode==='ur-en'?'en-ur':'ur-en');}
async function translateNow(){
  let text=document.getElementById('inputText').value.trim();
  if(!text) return alert('Pehle kuch likhein!');
  document.getElementById('outputText').innerText='Translating...';
  let pair=mode==='ur-en'?'ur|en':'en|ur';
  try{let res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+pair);let data=await res.json();document.getElementById('outputText').innerText=data.responseData.translatedText;}catch(e){document.getElementById('outputText').innerText='Error, dobara try karein';}
}
function copyText(){navigator.clipboard.writeText(document.getElementById('outputText').innerText);alert('Copy ho gaya!');}
async function pasteText(){let t=await navigator.clipboard.readText();document.getElementById('inputText').value=t;}
document.getElementById('inputText').addEventListener('input',e=>{document.getElementById('count').innerText=e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0;});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu to English Translator - SCREAMHIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:20px}
.container{max-width:700px;margin:auto;text-align:center}
h1{color:#ff2b2b;font-size:28px;margin-bottom:5px}
p{color:#aaa;margin-bottom:20px}
textarea{width:100%;min-height:120px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px;padding:15px;font-size:18px;direction:rtl;text-align:right;outline:none}
#output{direction:ltr;text-align:left;background:#111}
button{background:#ff2b2b;color:#fff;border:none;padding:14px 25px;border-radius:50px;font-size:17px;font-weight:bold;cursor:pointer;margin:15px 5px;width:90%;max-width:320px}
button:nth-child(2){background:#222;border:1px solid #444}
.small{color:#888;font-size:13px;margin-top:10px}
a{color:#ff2b2b;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Urdu to English</h1>
<p>Urdu likho, English pao - SCREAMHIVE Tool</p>

<textarea id="input" placeholder="یہاں اردو لکھیں... مثال: میرا نام دانش ہے"></textarea>

<br>
<button onclick="translateNow()">Translate Karo ➜</button>
<button onclick="copyText()">Copy Karo</button>

<textarea id="output" placeholder="Yahan English aayega... Example: My name is Danish" readonly></textarea>
<p class="small" id="status">Words: 0 | Powered by SCREAMHIVE</p>
<p><a href="index.html">← Wapas Home pe jao</a></p>
</div>

<script>
async function translateNow(){
  let text = document.getElementById("input").value.trim();
  let out = document.getElementById("output");
  let status = document.getElementById("status");
  if(!text){ out.value = "Pehle upar Urdu likho!"; return; }
  out.value = "Translating... thora wait karo...";
  document.getElementById("status").innerText = "Words: " + text.split(/\s+/).length;

  try{
    let res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=ur|en");
    let data = await res.json();
    let eng = data.responseData.translatedText;
    // Names fix - Danish waghera sahi rahe
    out.value = eng;
    status.innerText = "Words: " + text.split(/\s+/).length + " | Done ✅";
  }catch(e){
    out.value = "Internet slow hai, dobara try karo. Ya ye try karo: Mera naam Danish hai";
  }
}
function copyText(){
  let o = document.getElementById("output");
  o.select(); document.execCommand("copy");
  alert("Copy ho gaya ✅");
}
document.getElementById("input").addEventListener("input", function(){
  let t = this.value.trim();
  document.getElementById("status").innerText = "Words: " + (t ? t.split(/\s+/).length : 0);
});
</script>
</body>
</html>
